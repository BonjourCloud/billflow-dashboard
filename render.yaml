# Render Blueprint for the BillWill Express API.
# Variables marked `sync: false` are secrets or deployment-specific values;
# Render prompts for them when the Blueprint is first applied.
services:
  - type: web
    name: billwill-api
    runtime: node
    # Free instances sleep when idle; switch to a paid plan for production traffic.
    plan: free
    rootDir: server
    # NODE_ENV=production makes npm skip devDependencies, but the TypeScript
    # build needs them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render terminates TLS at a single proxy hop.
      - key: TRUST_PROXY
        value: "1"
      # Deployed frontend origin(s). Comma-separated, no trailing path.
      # Must exactly match the Vercel origins (used for CORS + Clerk azp).
      - key: CLIENT_URL
        value: https://billwill.site,https://www.billwill.site
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_CLERK_USER_IDS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
