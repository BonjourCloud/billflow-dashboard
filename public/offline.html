<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080F" />
    <title>BillWill is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05080F; color: #e6edf6; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #94a3b8; margin: 0 0 20px; font-size: .9rem; }
      button { background: #21C45D; color: #05080F; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>BillWill needs a connection to load your bills. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
